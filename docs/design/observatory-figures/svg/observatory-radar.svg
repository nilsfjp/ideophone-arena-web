cx="549.771" cy="787" r="4.5" fill="#211e19"/><line x1="72" y1="1232" x2="1128" y2="1232" stroke="#c9c2b4"/><text x="72" y="1254" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#211e19" text-anchor="start" letter-spacing="0.1em">IDEOPHONE ARENA · THE OBSERVATORY</text><text x="1128" y="1252" font-family="LINE Seed JP, sans-serif" font-size="16" font-weight="400" fill="#5e5749" text-anchor="end">Iida &amp; Akita (2023), perceptual strength norms for 510 Japanese words.</text><text x="1128" y="1276" font-family="LINE Seed JP, sans-serif" font-size="14" font-weight="400" fill="#867f70" text-anchor="end">Perceptual strength 0–5 per axis; kana are the words’ canonical forms.</text>
