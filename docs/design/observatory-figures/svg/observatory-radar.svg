<text x="72" y="84" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#5e5749" text-anchor="start" letter-spacing="0.1em">THE FINGERPRINT · PERCEPTUAL PROFILES</text><text x="72" y="150" font-family="Zen Maru Gothic, sans-serif" font-size="60" font-weight="700" fill="#211e19" text-anchor="start">A word’s six senses</text><polyline points="72,179.7 109.4,179.7 118.2,174.2 129.2,185.2 140.2,175.3 151.2,184.1 162.2,177.5 171,181.9 179.8,179.7 248,179.7" fill="none" stroke="#c8401f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline><text x="72" y="248" font-family="LINE Seed JP, sans-serif" font-size="26" font-weight="400" fill="#5e5749" text-anchor="start">Every normed word carries a profile across six perceptual axes —</text><text x="72" y="284" font-family="LINE Seed JP, sans-serif" font-size="26" font-weight="400" fill="#5e5749" text-anchor="start">how strongly it evokes each sense. Two ideophones, two shapes.</text><rect x="72" y="356" width="1056" height="832" rx="14" fill="#fbf8f2" stroke="#c9c2b4" stroke-width="1.25"/><line x1="116" y1="401" x2="150" y2="401" stroke="#211e19" stroke-width="2.5"/><text x="164" y="408" font-family="LINE Seed JP, sans-serif" font-size="27" font-weight="700" fill="#211e19" text-anchor="start">キラキラ</text><text x="294" y="408" font-family="LINE Seed JP, sans-serif" font-size="17" font-weight="400" fill="#5e5749" text-anchor="start">kirakira · glittering, sparkling</text><line x1="116" y1="439" x2="150" y2="439" stroke="#5e5749" stroke-width="2.5" stroke-dasharray="6 4"/><text x="164" y="446" font-family="LINE Seed JP, sans-serif" font-size="27" font-weight="700" fill="#211e19" text-anchor="start">すっきり</text><text x="294" y="446" font-family="LINE Seed JP, sans-serif" font-size="17" font-weight="400" fill="#5e5749" text-anchor="start">sukkiri · refreshingly, with a feeling of relief</text><polygon points="600,758 650.2294734194975,787 650.2294734194975,845 600,874 549.7705265805025,845 549.7705265805025,787" fill="none" stroke="#c9c2b4" stroke-width="1"></polygon><polygon points="600,700 700.4589468389948,758 700.4589468389948,874 600,932 499.5410531610051,874 499.54105316100515,758" fill="none" stroke="#c9c2b4" stroke-width="1"></polygon><polygon points="600,642 750.6884202584923,729 750.6884202584923,903 600,990 449.31157974150767,903 449.31157974150767,729" fill="none" stroke="#c9c2b4" stroke-width="1"></polygon><polygon points="600,584 800.9178936779898,700 800.9178936779898,932 600,1048 399.0821063220102,932 399.08210632201025,700" fill="none" stroke="#c9c2b4" stroke-width="1"></polygon><polygon points="600,526 851.1473670974872,671 851.1473670974872,961 600,1106 348.85263290251277,961 348.8526329025128,671" fill="none" stroke="#c9c2b4" stroke-width="1"></polygon><line x1="600" y1="816" x2="600" y2="526" stroke="#c9c2b4"/><text x="600" y="501" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#5e5749" text-anchor="middle" letter-spacing="0.1em">AUDITORY</text><line x1="600" y1="816" x2="851.147" y2="671" stroke="#c9c2b4"/><text x="877.128" y="661" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#5e5749" text-anchor="start" letter-spacing="0.1em">VISUAL</text><line x1="600" y1="816" x2="851.147" y2="961" stroke="#c9c2b4"/><text x="877.128" y="981" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#5e5749" text-anchor="start" letter-spacing="0.1em">GUSTATORY</text><line x1="600" y1="816" x2="600" y2="1106" stroke="#c9c2b4"/><text x="600" y="1141" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#5e5749" text-anchor="middle" letter-spacing="0.1em">INTEROCEPTIVE</text><line x1="600" y1="816" x2="348.853" y2="961" stroke="#c9c2b4"/><text x="322.872" y="981" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#5e5749" text-anchor="end" letter-spacing="0.1em">OLFACTORY</text><line x1="600" y1="816" x2="348.8