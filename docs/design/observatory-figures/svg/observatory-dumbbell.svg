<text x="72" y="84" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#5e5749" text-anchor="start" letter-spacing="0.1em">THE CLAIM · GUESSING BY MODALITY</text><text x="72" y="150" font-family="Zen Maru Gothic, sans-serif" font-size="62" font-weight="700" fill="#211e19" text-anchor="start">Sound carries furthest</text><polyline points="72,179.7 109.4,179.7 118.2,174.2 129.2,185.2 140.2,175.3 151.2,184.1 162.2,177.5 171,181.9 179.8,179.7 248,179.7" fill="none" stroke="#c8401f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline><text x="72" y="250" font-family="LINE Seed JP, sans-serif" font-size="27" font-weight="400" fill="#5e5749" text-anchor="start">In the thesis, 2AFC guessing slid as meanings turned inward:</text><text x="72" y="288" font-family="LINE Seed JP, sans-serif" font-size="27" font-weight="400" fill="#5e5749" text-anchor="start">sound (68.6%) → sight (64.2%) → inner states (59.7%).</text><rect x="72" y="340" width="1456" height="508" rx="14" fill="#fbf8f2" stroke="#c9c2b4" stroke-width="1.25"/><line x1="539.667" y1="380" x2="539.667" y2="790" stroke="#867f70" stroke-dasharray="5 5"/><text x="539.667" y="370" font-family="LINE Seed JP, sans-serif" font-size="12" font-weight="700" fill="#5e5749" text-anchor="middle" letter-spacing="0.1em">CHANCE · 50%</text><text x="112" y="482.333" font-family="LINE Seed JP, sans-serif" font-size="15" font-weight="700" fill="#5e5749" text-anchor="start" letter-spacing="0.1em">SOUND · AUDITORY</text><text x="112" y="510.333" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#867f70" text-anchor="start" letter-spacing="0.1em">N = 360</text><line x1="539.667" y1="488.333" x2="1163.722" y2="488.333" stroke="#8a5512" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/><circle cx="539.667" cy="488.333" r="6" fill="#fbf8f2" stroke="#867f70" stroke-width="2"/><circle cx="1163.722" cy="488.333" r="15" fill="#8a5512" stroke="#fbf8f2" stroke-width="2.5"/><text x="1193.722" y="497.333" font-family="Zen Maru Gothic, sans-serif" font-size="30" font-weight="700" fill="#211e19" text-anchor="start">68.6%</text><text x="112" y="587" font-family="LINE Seed JP, sans-serif" font-size="15" font-weight="700" fill="#5e5749" text-anchor="start" letter-spacing="0.1em">SIGHT · VISUAL</text><text x="112" y="615" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#867f70" text-anchor="start" letter-spacing="0.1em">N = 360</text><line x1="539.667" y1="593" x2="1014.834" y2="593" stroke="#99454f" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/><circle cx="539.667" cy="593" r="6" fill="#fbf8f2" stroke="#867f70" stroke-width="2"/><circle cx="1014.834" cy="593" r="15" fill="#99454f" stroke="#fbf8f2" stroke-width="2.5"/><text x="1044.834" y="602" font-family="Zen Maru Gothic, sans-serif" font-size="30" font-weight="700" fill="#211e19" text-anchor="start">64.2%</text><text x="112" y="691.667" font-family="LINE Seed JP, sans-serif" font-size="15" font-weight="700" fill="#5e5749" text-anchor="start" letter-spacing="0.1em">INNER STATES · INTEROCEPTIVE</text><text x="112" y="719.667" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#867f70" text-anchor="start" letter-spacing="0.1em">N = 360</text><line x1="539.667" y1="697.667" x2="865.611" y2="697.667" stroke="#386376" stroke-width="6" stroke-linecap="round" stroke-opacity="0.85"/><circle cx="539.667" cy="697.667" r="6" fill="#fbf8f2" stroke="#867f70" stroke-width="2"/><circle cx="865.611" cy="697.667" r="15" fill="#386376" stroke="#fbf8f2" stroke-width="2.5"/><text x="895.611" y="706.667" font-family="Zen Maru Gothic, sans-serif" font-size="30" font-weight="700" fill="#211e19" text-anchor="start">59.7%</text><line x1="372" y1="790" x2="1378" y2="790" stroke="#c9c2b4"/><line x1="372" y1="790" x2="372" y2="797" stroke="#867f70"/><text x="372" y="818" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="400" fill="#5e5749" text-anchor="middle">45%</text><line x1="539.667" y1="790" x2="539.667" y2="797" stroke="#867f70"/><text x="539.667" y="818" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="400" fill="#5e5749" text-anchor="middle">50%</text><line x1="707.333" y1="790" x2="707.333" y2="797" stroke="#867f70"/><text x="707.333" y="818" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="400" fill="#5e5749" text-anchor="middle">55%</text><line x1="875" y1="790" x2="875" y2="797" stroke="#867f70"/><text x="875" y="818" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="400" fill="#5e5749" text-anchor="middle">60%</text><line x1="1042.667" y1="790" x2="1042.667" y2="797" stroke="#867f70"/><text x="1042.667" y="818" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="400" fill="#5e5749" text-anchor="middle">65%</text><line x1="1210.333" y1="790" x2="1210.333" y2="797" stroke="#867f70"/><text x="1210.333" y="818" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="400" fill="#5e5749" text-anchor="middle">70%</text><line x1="1378" y1="790" x2="1378" y2="797" stroke="#867f70"/><text x="1378" y="818" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="400" fill="#5e5749" text-anchor="middle">75%</text><text x="875" y="840" font-family="LINE Seed JP, sans-serif" font-size="12" font-weight="700" fill="#5e5749" text-anchor="middle" letter-spacing="0.1em">GUESSING ACCURACY · % CORRECT</text><line x1="72" y1="892" x2="1528" y2="892" stroke="#c9c2b4"/><text x="72" y="914" font-family="LINE Seed JP, sans-serif" font-size="13" font-weight="700" fill="#211e19" text-anchor="start" letter-spacing="0.1em">IDEOPHONE ARENA · THE OBSERVATORY</text><text x="1528" y="912" font-family="LINE Seed JP, sans-serif" font-size="16" font-weight="400" fill="#5e5749" text-anchor="end">Paulsson (2026), MA thesis: the study this arena replicates (30 pairs, 36 participants).</text><text x="1528" y="936" font-family="LINE Seed JP, sans-serif" font-size="14" font-weight="400" fill="#867f70" text-anchor="end">Bars run from chance (50%) to the study mean; N = per-modality guesses across 10 pairs.</text>
